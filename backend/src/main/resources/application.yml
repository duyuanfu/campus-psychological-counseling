server:
  port: 8088

spring:
  application:
    name: campus-psychology-server

  # 纯正 MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 支持环境变量覆盖：MYSQL_HOST, MYSQL_PORT, MYSQL_DB，默认连接 127.0.0.1:3306/campus_psychology
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:campus_psychology}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # 保证密钥至少512位(64字节)
  secret: CampusPsychologySuperSecretKey2025ForSecureAuthTokensOver64BytesLongString
  expiration: 604800000 # 7天
